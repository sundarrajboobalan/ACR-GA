name: Build and Deploy Container in ACR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v2

   

    - uses: azure/docker-login@v1
      with:
        login-server: democtr123.azurecr.io
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - run: |
        docker build . -t democtr123.azurecr.io/webapp
        docker push democtr123.azurecr.io/webapp
